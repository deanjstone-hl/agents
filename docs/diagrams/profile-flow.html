<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agents profile to session</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: var(--background, #f5f7f8);
      --ink: var(--foreground, #241523);
      --soft: var(--muted-foreground, #6f6873);
      --teal: var(--primary, #0a6f75);
      --rule: var(--border, #cdd4dc);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: var(--background, #14181c);
        --ink: var(--foreground, #e8eaed);
        --soft: var(--muted-foreground, #9aa3ad);
        --teal: var(--primary, #4fc3c8);
        --rule: var(--border, #2c343c);
      }
    }
    :root[data-theme="dark"] {
      --paper: var(--background, #14181c);
      --ink: var(--foreground, #e8eaed);
      --soft: var(--muted-foreground, #9aa3ad);
      --teal: var(--primary, #4fc3c8);
      --rule: var(--border, #2c343c);
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); padding: 16px; }
    .frame { max-width: 360px; }
    .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-bottom: 4px; }
    h1 { font-size: 20px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
    .lede { font-size: 13px; line-height: 1.45; color: var(--soft); margin-bottom: 12px; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 320px; display: block; }
    .src { font-size: 11px; line-height: 1.5; color: var(--soft); margin-top: 12px; }
    .src a { color: var(--teal); }
    .src code { font-family: var(--mono); font-size: 10px; }
    .divider { stroke: var(--rule); stroke-width: 1; }
    .lane { fill: var(--soft); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; }
    .flow { fill: none; stroke: var(--soft); stroke-width: 1.2; }
    .dashed { stroke-dasharray: 5,4; }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .node.focal { fill: color-mix(in srgb, var(--teal) 14%, var(--paper)); stroke: var(--teal); stroke-width: 1.6; }
    .node.ext { stroke-dasharray: 4,3; }
    .step:target .node { stroke: var(--teal); stroke-width: 2.6; fill: color-mix(in srgb, var(--teal) 22%, var(--paper)); }
    .name { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 600; text-anchor: middle; }
    .sub { fill: var(--soft); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
    .note { fill: var(--soft); font-family: var(--sans); font-size: 11px; font-style: italic; }
    .key { fill: var(--soft); font-family: var(--sans); font-size: 10px; }
    .head-soft { fill: var(--soft); }
    .head-teal { fill: var(--teal); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow</p>
    <h1>agents profile to session</h1>
    <p class="lede">The intended path from a profile to a live session. Only the first three steps exist today.</p>
    <div class="scroll">
    <svg viewBox="0 0 360 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profile-title profile-desc">
      <title id="profile-title">agents profile to session</title>
      <desc id="profile-desc">A profile is written as a markdown file that follows the doctrine and the schema. The local check lints it. A planned render step joins the shared culture into each generated charter and brief and commits generated output. argus-config consumes that output through its own installer, deploy gate and promotion, and a session sees it only after that promotion.</desc>
      <defs>
        <marker id="profile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-soft" points="0 0, 8 3, 0 6"/></marker>
        <marker id="profile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-teal" points="0 0, 8 3, 0 6"/></marker>
      </defs>
<path class="flow" d="M 180,72 L 180,96" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,144 L 180,168" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,216 L 180,240" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,288 L 180,312" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,360 L 180,384" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,432 L 180,456" marker-end="url(#profile-arrow)"/>
<path class="flow" d="M 180,504 L 180,528" marker-end="url(#profile-arrow)"/>
<g id="step-profile-doctrine" class="step">
<rect class="node" x="8" y="24" width="344" height="48" rx="6"/>
<text class="name" x="180" y="45">Doctrine and schema</text>
<text class="sub" x="180" y="60">units.md, culture.md, schema fields</text>
</g>
<g id="step-profile-profile" class="step">
<rect class="node ext" x="8" y="96" width="344" height="48" rx="6"/>
<text class="name" x="180" y="117">Profile written</text>
<text class="sub" x="180" y="132">one .md per profile: front matter, then body</text>
</g>
<g id="step-profile-check" class="step">
<rect class="node focal" x="8" y="168" width="344" height="48" rx="6"/>
<text class="name" x="180" y="189">bash scripts/check.sh</text>
<text class="sub" x="180" y="204">bash -n and markdown lint; schema checks later</text>
</g>
<g id="step-profile-push" class="step">
<rect class="node" x="8" y="240" width="344" height="48" rx="6"/>
<text class="name" x="180" y="261">Pull --rebase, push</text>
<text class="sub" x="180" y="276">straight to main</text>
</g>
<g id="step-profile-render" class="step">
<rect class="node ext" x="8" y="312" width="344" height="48" rx="6"/>
<text class="name" x="180" y="333">Render step</text>
<text class="sub" x="180" y="348">render.sh joins culture; planned [speculation]</text>
</g>
<g id="step-profile-generated" class="step">
<rect class="node ext" x="8" y="384" width="344" height="48" rx="6"/>
<text class="name" x="180" y="405">generated/ committed</text>
<text class="sub" x="180" y="420">charters and briefs; planned [speculation]</text>
</g>
<g id="step-profile-install" class="step">
<rect class="node ext" x="8" y="456" width="344" height="48" rx="6"/>
<text class="name" x="180" y="477">argus-config installs</text>
<text class="sub" x="180" y="492">its installer, deploy gate and promotion</text>
</g>
<g id="step-profile-session" class="step">
<rect class="node ext" x="8" y="528" width="344" height="48" rx="6"/>
<text class="name" x="180" y="549">A session changes</text>
<text class="sub" x="180" y="564">only after argus-config promotes</text>
</g>
<text class="note" x="8" y="618">agents is not a deploy repo: nothing here changes a</text>
<text class="note" x="8" y="632">session until argus-config promotes it.</text>
<text class="note" x="8" y="650">Dashed steps are planned or live in another repo. The</text>
<text class="note" x="8" y="664">order of the render step and the commit of generated/ is</text>
<text class="note" x="8" y="678">inferred from the README: [speculation].</text>
<text class="note" x="8" y="696">A profile never edits itself; an agent may propose one</text>
<text class="note" x="8" y="710">Learned line only as a PR the owner reviews.</text>
<rect class="node " x="8" y="734" width="14" height="10" rx="2"/>
<text class="key" x="28" y="743">Step</text>
<rect class="node focal" x="62.8" y="734" width="14" height="10" rx="2"/>
<text class="key" x="82.8" y="743">Gate</text>
<rect class="node ext" x="117.6" y="734" width="14" height="10" rx="2"/>
<text class="key" x="137.6" y="743">Planned or other repo</text>
<line class="flow" x1="260.79999999999995" y1="739" x2="284.79999999999995" y2="739" marker-end="url(#profile-arrow)"/>
<text class="key" x="290.79999999999995" y="743">Flow</text>
    </svg>
    </div>
    <p class="src">Sources: <code>README.md</code> (How it reaches a session, Local check), <code>doctrine/culture.md</code>, <code>schema/README.md</code>, <code>scripts/check.sh</code>.</p>
  </div>
</body>
</html>
